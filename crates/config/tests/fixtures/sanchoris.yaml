Version: 1
Projects:
  shop:
    Repos:
      frontend: { Repo: github.com/acme/shop-web }
      backend: { Repo: github.com/acme/shop-api }
    DefaultModel: { Agent: claude, Model: claude-sonnet-5-5, Credential: my-claude }
    Scripts:
      install: { Command: 'cd frontend && pnpm install && cd ../backend && cargo build', RunOnCreate: true, Async: false, TimeoutSeconds: 3600 }
      test: { Command: 'cd frontend && pnpm test', TimeoutSeconds: 900 }
    UsageLimit: { Resume: auto }
    Workspace: { Host: cloud, Architecture: arm64, IdleSeconds: 900 }
Triggers:
  labeled-issue:
    Enabled: true
    EventPattern:
      source: [github]
      detail-type: [Issue Labeled]
      detail:
        repository: [acme/shop-web, acme/shop-api]
        label: [sanchoris]
        sender: { login: [mika-dev, sota-dev] }
    InputPathsMap: { repository: $.detail.repository, number: $.detail.issue.number, title: $.detail.issue.title }
    Start:
      Project: shop
      Message: 'Resolve issue <number> in <repository>: <title>. Write tests for the change, then run open-pr-green-ci.'
