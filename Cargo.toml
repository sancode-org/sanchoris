[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sancode-org/sanchoris"

[workspace.dependencies]
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodbstreams = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aes-gcm = "0.10"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
indexmap = "2"
leanfran = { version = "=0.14.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
